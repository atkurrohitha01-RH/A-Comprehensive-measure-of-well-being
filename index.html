<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HDI Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4 py-md-5">

    <!-- Header -->

    <div class="row align-items-center mb-4">

        <div class="col-md-8">

            <h1 class="display-5 fw-bold title-color">
                <i class="bi bi-graph-up-arrow me-2 gold"></i>
                HDI Predictor
            </h1>

            <p class="lead subtitle">

                <i class="bi bi-globe2"></i>

                Human Development Index

                <span class="badge bg-dark text-white ms-2">

                    <i class="bi bi-cpu"></i>

                    Linear Regression

                </span>

            </p>

        </div>

        <div class="col-md-4 text-md-end">

            <span class="country-badge">

                <i class="bi bi-bar-chart-fill"></i>

                189+ Countries

            </span>

            <span class="country-badge ms-2">

                <i class="bi bi-database"></i>

                2024 Data

            </span>

        </div>

    </div>

    <!-- Main Card -->

    <div class="card-glass p-4 p-xl-5">

        <div class="row g-4">

            <!-- Form -->

            <div class="col-lg-7">

                <h3 class="mb-3">

                    <i class="bi bi-sliders2"></i>

                    Enter Country Indicators

                </h3>

                <p class="small-meta">

                    Life Expectancy · Education · Income

                </p>

                <form id="hdiForm">

                    <div class="row g-4">

                        <div class="col-md-6">

                            <label class="form-label">

                                Life Expectancy

                            </label>

                            <input

                                type="number"

                                class="form-control"

                                id="lifeExp"

                                value="72.5"

                                step="0.1"

                                required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Mean Years of Schooling

                            </label>

                            <input

                                type="number"

                                class="form-control"

                                id="meanSchool"

                                value="10.2"

                                step="0.1"

                                required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Expected Years of Schooling

                            </label>

                            <input

                                type="number"

                                class="form-control"

                                id="expectedSchool"

                                value="13.5"

                                step="0.1"

                                required>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                GNI per Capita (PPP)

                            </label>

                            <input

                                type="number"

                                class="form-control"

                                id="gni"

                                value="18500"

                                required>

                        </div>

                        <div class="col-12">

                            <label class="form-label">

                                Country

                            </label>

                            <input

                                type="text"

                                class="form-control"

                                id="countryName"

                                value="Sample">

                        </div>

                        <div class="col-12 text-end">

                            <button

                                class="btn btn-primary-custom"

                                id="predictBtn"

                                type="submit">

                                <i class="bi bi-calculator"></i>

                                Predict HDI

                            </button>

                            <button

                                class="btn btn-outline-custom"

                                type="reset">

                                Reset

                            </button>

                        </div>

                    </div>

                </form>

            </div>

            <!-- Result -->

            <div class="col-lg-5">

                <h3>

                    <i class="bi bi-speedometer2"></i>

                    HDI Result

                </h3>

                <p class="small-meta">

                    Score · Tier · Insight

                </p>

                <div

                    id="resultPanel"

                    class="result-box">

                    <div

                        id="resultContent"

                        class="text-center">

                        <i class="bi bi-bar-chart-line display-1 text-secondary"></i>

                        <p class="mt-3">

                            Submit values to predict HDI

                        </p>

                    </div>

                    <div

                        id="resultLoader"

                        class="d-none text-center">

                        <div class="spinner-border"></div>

                        <p>

                            Calculating...

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JavaScript -->

<script src="js/script.js"></script>

</body>
</html>
